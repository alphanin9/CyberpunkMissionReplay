# Mirrors .github/workflows/build.yml.
#
# Runs on GitLab-hosted Windows runners (beta). They have no Docker executor, so
# there is no `image:` and every script line is PowerShell. Windows runners bill at a
# higher rate than Linux against the namespace's compute minutes.
#
# To use your own runner instead, swap the tag below for whatever you registered.

stages:
  - build

build:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    # GitLab's Windows image ships CMake 3.27.8, and xmake prefers a system cmake when
    # it finds one. safetyhook needs >= 3.28, so put a newer one ahead of it on PATH.
    - $cmakeVer = "3.31.7"
    - Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$cmakeVer/cmake-$cmakeVer-windows-x86_64.zip" -OutFile cmake.zip -UseBasicParsing
    - Expand-Archive cmake.zip -DestinationPath "$env:CI_PROJECT_DIR\.cmake" -Force
    - $env:PATH = "$env:CI_PROJECT_DIR\.cmake\cmake-$cmakeVer-windows-x86_64\bin;$env:PATH"
    - cmake --version
    # The install script appends its install dir to $env:Path for this session.
    - irm https://xmake.io/psget.text | iex
    - xmake --version
  script:
    - xmake repo --update
    - xmake config --yes
    - xmake package
    # GitLab only warns on empty artifact paths; GitHub's if-no-files-found: error
    # fails the job, so check explicitly to keep the behaviour the same.
    - if (-not (Test-Path packaging)) { Write-Error "packaging/ was not produced"; exit 1 }
    - if (-not (Test-Path packaging_pdb)) { Write-Error "packaging_pdb/ was not produced"; exit 1 }
  artifacts:
    name: "MissionReplay_$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - packaging/
      - packaging_pdb/
